<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="icon" href="cat.png" type="image/png">
    <link rel="stylesheet" href="feedback.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
    <script src="feedback.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <h1>Feedback</h1>
    </nav>

    <main class="feedback-container">
        <h2>Write a message</h2>
        <p class="intro">Have something to talk about the articles or the website? Feel free to leave a message.</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Feedback</label>
                <textarea id="message" name="message" rows="7" placeholder="I enjoyed reading your articles ..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-text">Submit feedback</span>
                <span class="btn-loader">Sending...</span>
            </button>
        </form>
    </main>

    <div id="success-modal" class="success-modal">
        <div class="modal-content">
            <h2>Thank you.</h2>
            <p>Your feedback has been submitted successfully.</p>
            <button id="close-modal" class="close-modal">Close</button>
        </div>
    </div>

    <div class="home-button">
        <a href="index.html">
            <img src="cat.png" alt="Home" class="avatar1">
        </a>
    </div>

</body>
</html>
